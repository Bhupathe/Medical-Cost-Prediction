
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Cost Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    <div class="header">
        <h1>Medical Cost Prediction</h1>
        <p>Enter the details to estimate medical insurance charges.</p>
    </div>

    <form action="{{ url_for('home') }}" method="post">

        <label for="age">Age</label>
        <input type="number" id="age" name="age"
               min="18" max="100" required>
        <br />

        <label for="sex">Gender</label>
        <select id="sex" name="sex" required>
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        <br />

        <label for="bmi">BMI</label>
        <input type="number" id="bmi" name="bmi"
               min="10" max="100" step="0.001" required>
        <br />

        <label for="children">Number of Children</label>
        <input type="number" id="children" name="children"
               min="0" max="20" required>
        <br />

        <label for="smoker">Smoker</label>
        <select id="smoker" name="smoker" required>
            <option value="">Select smoking status</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
        <br />

        <label for="region">Region</label>
        <select id="region" name="region" required>
            <option value="">Select region</option>
            <option value="northeast">Northeast</option>
            <option value="northwest">Northwest</option>
            <option value="southeast">Southeast</option>
            <option value="southwest">Southwest</option>
        </select>
        <br />
        
        <button type="submit">Predict Medical Cost</button>
    </form>

    {% if prediction is not none %}
        <h2>Predicted Medical Charges</h2>
        <p>{{ prediction | round(2) }}</p>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
</body>
</html>
